<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Isometra&family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <style>

        body{

            font-family: "Inter", sans-serif;

        }

        table{
            margin: 0 auto;
            border-collapse: collapse;
        }

        th, td{
            border: 1px solid #999;
            padding: 8px 12px;
            text-align: left;
        }

        th{
            background-color: #ddd;
        }


    </style>


</head>
<body>


    <center>
    <h1>FORMULARIO COMPLEMETAR PARA A FORÇA MILITAR!</h1>
    <p>Por favor preecha com seus dados correramente!</p>
    </center>



    <form action="/enviar" method="POST">

        <table>

            <!-- 1. INFORMAÇÕES PESSOAIS -->
            <tr>
                <th colspan="2">1. INFORMAÇÕES PESSOAIS</th>
            </tr>
            <tr>
                <td><label for="nome">Nome Completo:</label></td>
                <td><input type="text" id="nome" name="nome" placeholder="Ex: João vitor" required size="50"></td>
            </tr>
            <tr>
                <td><label for="nome_guerra">Nome de Guerra:</label></td>
                <td><input type="text" id="nome_guerra" name="nome_guerra" placeholder="Ex: G Santos" required size="50"></td>
            </tr>
            <tr>
                <td><label for="data">Data de praça:</label></td>
                <td><input type="date" id="data" name="data" required></td>
            </tr>
            <tr>
                <td><label for="email">Email para Contato:</label></td>
                <td><input type="email" id="email" name="email" placeholder="Ex: nome@exemplo.com" required size="30"></td>
            </tr>
            <tr>
                <td><label for="cpf">CPF:</label></td>
                <td><input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required size="20"></td>
            </tr>
            <tr>
                <td><label for="id_militar">Identidade Militar:</label></td>
                <td><input type="text" id="id_militar" name="id_militar" placeholder="N° Registro" required size="20"></td>
            </tr>

            <!-- 2. INFORMAÇÕES FUNCIONAIS -->
            <tr>
                <th colspan="2">2. Informações Funcionais</th>
            </tr>
            <tr>
                <td><label for="posto_grad">Posto/Graduação:</label></td>
                <td>
                    <select id="posto_grad" name="posto_grad" required>
                    <option value="">Selecione...</option>
                    <option value="soldado">Soldado</option>
                    <option value="cabo">Cabo</option>
                    <option value="sargento">Sargento</option>
                    <option value="subtenente">Subtenente</option>
                    <option value="aspirante">Aspirante</option>
                    <option value="tenente">Tenente</option>
                    <option value="capitao">Capitão</option>
                    <option value="major">Major</option>
                    <option value="tencoronel">TenCoronel</option>
                    <option value="coronel">Coronel</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="setor">Seção ou Setor:</label></td>
                <td><input type="text" id="setor" name="setor" placeholder="Ex:Almoxerifado" required size="40"></td>
            </tr>

            <!-- 3. CONTATO E LOCALIZAÇÃO -->
            <tr>
                <th colspan="2">3. Contato e Localização</th>
            </tr>
            <tr>
                <td><label for="celular">Celular / Telefone:</label></td>
                <td>
                    <input
                        type="tel"
                        id="celular"
                        name="celular"
                        placeholder="(99) 99999-9999"
                        pattern="[0-9]{2}[0-9]{5}[0-9]{4}"
                        title="Digite apenas números com o DDD. Exemplo: 11999999999"
                        required
                        size="20">
                </td>
            </tr>
            <tr>
                <td><label for="endereco">Endereço Residencial:</label></td>
                <td><input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, cidade - UF" required size="50"></td>
            </tr>
            <tr>
                <td>Marque a Opção correta:</td>
                <td>
                    <input type="radio" id="a_pos" name="sangue" value="A+" required>
                    <label for="a_pos">A+</label>
                    <input type="radio" id="a_neg" name="sangue" value="A-">
                    <label for="a_neg">A-</label>
                    <input type="radio" id="o_pos" name="sangue" value="O+">
                    <label for="o_pos">O+</label>
                    <input type="radio" id="o_neg" name="sangue" value="O-">
                    <label for="o_neg">O-</label>
                    <input type="radio" id="b_pos" name="sangue" value="B+">
                    <label for="b_pos">B+</label>
                    <input type="radio" id="b_neg" name="sangue" value="B-">
                    <label for="b_neg">B-</label>
                </td>
            </tr>

            <!-- BOTÕES -->
            <tr>
                <td colspan="2" style="text-align: center;">
                    <button type="reset"><b>Limpar Dados</b></button>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <button type="submit"><b>Enviar Cadastro</b></button>
                </td>
            </tr>

        </table>

    </form>


</body>
</html>
