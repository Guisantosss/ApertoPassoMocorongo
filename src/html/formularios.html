<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>

    <form>
    <label>
        Nome: <input type="text" style="width:40%"><br><br>

    </label>
    <label>
        Numero: <input type="number" style="width:40%" min="0" max="5"> <br><br>
    </label>

    <label>
        Data: <input type="date"><br><br>
        Senha: <input type="password" name="Senha" placeholder="Insira a senha"><br>
    </label>

    <label>
        Escolha de Opções: 
        <input type="Radio" name="escolha"> Escolha 1
        <input type="Radio" name="escolha"> Escolha 2
        <input type="Radio" name="escolha"> Escolha 3
    </label><br>
    <label>
        Escolha de Opções: 
        <input type="checkbox" name="multipla"> Escolha 1
        <input type="checkbox" name="multipla"> Escolha 2
        <input type="checkbox" name="multipla"> Escolha 3
    </label><br>

    
    <br>
    
    <label>
        Textarea <br> <textarea></textarea>
    </label><br>
    
    <input type="reset">
    <input type="submit">




    </form>

    
</body>
</html>
